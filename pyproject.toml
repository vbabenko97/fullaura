[project]
name = "fullaura"
version = "0.1.0"
description = "Personal style planning with real products and Meta models."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx2>=2,<3",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.32,<0.1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
