name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Check Python
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pytest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build container
        run: docker build --tag lookpilot:ci .
      - name: Check container over HTTP
        run: |
          docker run --detach --rm --name lookpilot-ci --publish 127.0.0.1:8000:8000 lookpilot:ci
          uv run --frozen python scripts/smoke_http.py
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs lookpilot-ci 2>/dev/null || true
          docker stop lookpilot-ci 2>/dev/null || true
